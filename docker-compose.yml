version: '3.8'

services:
  litellm-helper:
    build: .
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=${PORT:-5001}
      - LITELLM_HELPER_PASSWORD=${LITELLM_HELPER_PASSWORD}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      
    restart: unless-stopped