services:
  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: litellm_init_volumes
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories under /data..."
        mkdir -p /data/litellm-helper /data/litellm /data/redis_data

        echo ">>> [Init] Setting permissions..."
        chmod -R 775 /data

        # Ensure default empty LiteLLM config exists if not mounted yet
        if [ ! -f /data/litellm/config.yaml ]; then
          echo "model_list: []" > /data/litellm/config.yaml
          chmod 664 /data/litellm/config.yaml
        fi

        echo ">>> [Init] LiteLLM directories initialized successfully!"

  # ========================================================
  # LITELLM HELPER / CONTROL PLANE
  # ========================================================
  litellm-helper:
    build: .
    container_name: litellm-helper
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${LITELLM_HELPER_PORT:-5001}:${LITELLM_HELPER_PORT:-5001}"
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/litellm-helper:/app/data
      - ${WORKDIR:-/srv/data/ai-ui}/litellm:/app/shared
    environment:
      - TZ=${TZ:-UTC}
      - PORT=${LITELLM_HELPER_PORT:-5001}
      - URL_PREFIX=/litellm-helper
      - LITELLM_HELPER_PASSWORD=${LITELLM_HELPER_PASSWORD}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      # HTTPS Router
      - traefik.http.routers.litellm-helper.rule=PathPrefix(`/litellm-helper`) || Host(`${LITELLM_HELPER_DOMAIN:-helper.homelab-gw.ts.net}`)
      - traefik.http.routers.litellm-helper.entrypoints=websecure
      - traefik.http.routers.litellm-helper.tls=true
      - traefik.http.routers.litellm-helper.priority=100
      - traefik.http.middlewares.litellm-helper-strip.stripprefix.prefixes=/litellm-helper
      - traefik.http.routers.litellm-helper.middlewares=litellm-helper-strip
      - traefik.http.services.litellm-helper.loadbalancer.server.port=${LITELLM_HELPER_PORT:-5001}
      - traefik.docker.network=${SHARED_NETWORK:-shared_net}

      # HTTP Router (Fallback plain HTTP)
      - traefik.http.routers.litellm-helper-http.rule=PathPrefix(`/litellm-helper`) || Host(`${LITELLM_HELPER_DOMAIN:-helper.homelab-gw.ts.net}`)
      - traefik.http.routers.litellm-helper-http.entrypoints=web
      - traefik.http.routers.litellm-helper-http.priority=100
      - traefik.http.routers.litellm-helper-http.middlewares=litellm-helper-strip
      - traefik.http.routers.litellm-helper-http.service=litellm-helper
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:\" + str(${LITELLM_HELPER_PORT:-5001}) + \"/login\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # REDIS CACHE (For LiteLLM Usage-Based Routing & Cache)
  # ========================================================
  litellm-redis:
    image: redis:alpine
    container_name: litellm-redis
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # LITELLM GATEWAY/PROXY (Stateless Mode)
  # ========================================================
  litellm:
    build: 
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm
    platform: linux/arm64
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${LITELLM_IP:-0.0.0.0}:${LITELLM_PORT:-4000}:4000"
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/litellm/config.yaml:/app/config.yaml
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      litellm-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
      - LITELLM_TIMEOUT=${LITELLM_TIMEOUT:-600}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_HOST=litellm-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_TIMEOUT=${SERVER_TIMEOUT:-600}
      - LITELLM_WORKERS=${LITELLM_WORKERS:-4}
      - HF_TOKEN=${HF_TOKEN}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-600}
      - GENERIC_LOGGER_ENDPOINT=http://litellm-helper:${LITELLM_HELPER_PORT:-5001}/api/usage/webhook?token=${LITELLM_HELPER_PASSWORD}
    command: [
      "--config", "/app/config.yaml",
      "--port", "4000",
      "--reload"
    ]
    labels:
      - traefik.enable=true
      # HTTPS Router
      - traefik.http.routers.litellm.rule=PathPrefix(`/litellm`) || Host(`${LITELLM_DOMAIN:-litellm.homelab-gw.ts.net}`)
      - traefik.http.routers.litellm.entrypoints=websecure
      - traefik.http.routers.litellm.tls=true
      - traefik.http.routers.litellm.priority=100
      - traefik.http.middlewares.litellm-strip.stripprefix.prefixes=/litellm
      - traefik.http.routers.litellm.middlewares=litellm-strip
      - traefik.http.services.litellm.loadbalancer.server.port=4000
      - traefik.docker.network=${SHARED_NETWORK:-shared_net}

      # HTTP Router (Fallback plain HTTP)
      - traefik.http.routers.litellm-http.rule=PathPrefix(`/litellm`) || Host(`${LITELLM_DOMAIN:-litellm.homelab-gw.ts.net}`)
      - traefik.http.routers.litellm-http.entrypoints=web
      - traefik.http.routers.litellm-http.priority=100
      - traefik.http.routers.litellm-http.middlewares=litellm-strip
      - traefik.http.routers.litellm-http.service=litellm
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shared_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
