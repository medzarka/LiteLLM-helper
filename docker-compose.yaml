services:
  # ========================================================
  # INITIALIZATION SERVICE (Automated Host Storage Setup)
  # ========================================================
  init-volumes:
    image: alpine:latest
    container_name: litellm_init_volumes
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ">>> [Init] Creating storage directories under /data..."
        mkdir -p /data/litellm-helper /data/litellm /data/redis_data

        echo ">>> [Init] Setting permissions..."
        chmod -R 775 /data

        # Ensure default empty LiteLLM config exists if not mounted yet
        if [ ! -f /data/litellm/config.yaml ]; then
          echo "model_list: []" > /data/litellm/config.yaml
          chmod 664 /data/litellm/config.yaml
        fi

        echo ">>> [Init] LiteLLM directories initialized successfully! Storage guard active."
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/litellm && test -d /data/litellm-helper || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ========================================================
  # LITELLM HELPER / CONTROL PLANE
  # ========================================================
  litellm-helper:
    build: .
    image: ghcr.io/medzarka/litellm-helper:latest
    container_name: litellm-helper
    restart: unless-stopped
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/litellm-helper:/app/data
      - ${WORKDIR:-/srv/data/ai-ui}/litellm:/app/shared
    environment:
      - TZ=${TZ:-UTC}
      - PORT=${LITELLM_HELPER_PORT:-5001}
      - URL_PREFIX=/litellm-helper
      - LITELLM_HELPER_PASSWORD=${LITELLM_HELPER_PASSWORD}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
      - ROOT_DOMAIN=${ROOT_DOMAIN:-bluewave.work}
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:\" + str(${LITELLM_HELPER_PORT:-5001}) + \"/login\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    networks:
      - shared_net
      - homelab_swarm_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm-helper.rule=Host(`litellm-helper.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.litellm-helper.entrypoints=websecure"
      - "traefik.http.routers.litellm-helper.tls=true"
      - "traefik.http.routers.litellm-helper.middlewares=authelia-sso@file,app-fail2ban@file,security-headers@file"
      - "traefik.http.services.litellm-helper.loadbalancer.server.port=5001"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # REDIS CACHE (For LiteLLM Usage-Based Routing & Cache)
  # ========================================================
  litellm-redis:
    image: redis:alpine
    container_name: litellm-redis
    platform: linux/arm64
    restart: unless-stopped
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    depends_on:
      init-volumes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    networks:
      - shared_net
      - homelab_swarm_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================================
  # LITELLM GATEWAY/PROXY (Stateless Mode)
  # ========================================================
  litellm:
    build: 
      context: .
      dockerfile: Dockerfile.litellm
    container_name: litellm
    platform: linux/arm64
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${WORKDIR:-/srv/data/ai-ui}/litellm/config.yaml:/app/config.yaml
    depends_on:
      init-volumes:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
      - LITELLM_TIMEOUT=${LITELLM_TIMEOUT:-600}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - REDIS_HOST=litellm-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - SERVER_TIMEOUT=${SERVER_TIMEOUT:-600}
      - LITELLM_WORKERS=${LITELLM_WORKERS:-2}
      - HF_TOKEN=${HF_TOKEN}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-600}
      - GENERIC_LOGGER_ENDPOINT=http://litellm-helper:${LITELLM_HELPER_PORT:-5001}/api/usage/webhook?token=${LITELLM_HELPER_PASSWORD}
    command: [
      "--config", "/app/config.yaml",
      "--port", "4000",
      "--reload"
    ]
    deploy:
      resources:
        limits:
          memory: 2560M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:4000/health/liveliness\").read()' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shared_net
      - homelab_swarm_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`litellm.${ROOT_DOMAIN:-example.com}`)"
      - "traefik.http.routers.litellm.entrypoints=websecure"
      - "traefik.http.routers.litellm.tls=true"
      - "traefik.http.routers.litellm.middlewares=app-fail2ban@file,security-headers@file"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
      - "traefik.docker.network=${SWARM_NETWORK:-homelab_swarm_net}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_net:
    name: ${SHARED_NETWORK:-shared_net}
    external: true
  homelab_swarm_net:
    name: ${SWARM_NETWORK:-homelab_swarm_net}
    external: true
